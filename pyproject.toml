[project]
name = "cotton-claims-agent"
version = "0.1.0"
description = "LangGraph agent for triaging cotton quality claims"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain-google-genai>=2.0",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "TID",  # flake8-tidy-imports
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long descriptions in test asserts/fixtures

[tool.pytest.ini_options]
markers = [
    "integration: tests that call the real Gemini API (slow, cost tokens, non-deterministic)",
]
addopts = "-m 'not integration'"

[project.optional-dependencies]
app = ["streamlit>=1.38"]
