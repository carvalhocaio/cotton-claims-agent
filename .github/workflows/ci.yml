name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Dependency audit (pip-audit)
        run: uv run pip-audit

      - name: Unit tests
        # Dummy key: unit tests don't call the API, but the models are
        # built at import time and require a key to be present.
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: uv run pytest
