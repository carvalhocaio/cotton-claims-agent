name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format)
        run: uv run ruff format --check

      - name: Testes unitários
        # Chave fictícia: os testes unitários não chamam a API, mas os
        # modelos são construídos no import e exigem uma chave presente.
        env:
          GEMINI_API_KEY: dummy-key-for-ci
        run: uv run pytest
